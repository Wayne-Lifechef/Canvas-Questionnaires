text
protocol_name: "SARC-F"
paper_form_file: "SARC-F/ques_SARC-F.pdf"

status:
  in_canvas: true         # set to true when loaded/configured in Canvas
  in_mip: false           # set to true when MIP side is wired

canvas_questionnaire:
  name: "SARC-F"
  google_sheet_url: "https://docs.google.com/spreadsheets/d/1vU3pQ_Z7JyK6UIZiZsnIyRI5uDx7RKXULuRATNvdF8k/edit?gid=347953653#gid=347953653"
  google_sheet_tab: "ques_SARC-F"

profile_fields:
  - paper_label: "Name"
    canonical_field_id: "patient.full_name"
    canvas_model: "Patient"
    canvas_field: "full_name"
    existing_field: true
    notes: "Prefilled from patient profile; not asked in questionnaire."

  - paper_label: "Date"
    canonical_field_id: "Questionnaire_Created_Date"
    canvas_model: "QuestionnaireResponse"
    canvas_field: "address"
    existing_field: true
    notes: "Date field part of the questionnaire metadata when created"

questionnaire_fields:
  - paper_label: "Strength - How much difficulty do you have in lifting and carrying 10 pounds?"
    question_code: "Strength"
    google_sheet_tab: "ques_SARC-F"
    google_sheet_row: 6
    response_type: "SING"
    canonical_field_id: ""
    
  - paper_label: "Walking - How much difficulty do you have walking across a room?"
    question_code: "Walking"
    google_sheet_tab: "ques_SARC-F"
    google_sheet_row: 10
    response_type: "SING"
    canonical_field_id: ""

    - paper_label: "How much difficulty do you have transferring from a chair or bed?"
    question_code: "Transferring"
    google_sheet_tab: "ques_SARC-F"
    google_sheet_row: 14
    response_type: "SING"
    canonical_field_id: ""
    
    - paper_label: "Climbing - How much difficulty do you have climbing a flight of 10 stairs?"
    question_code: "Stairs"
    google_sheet_tab: "ques_SARC-F"
    google_sheet_row: 18
    response_type: "SING"
    canonical_field_id: ""
  
    - paper_label: "Falls - How many times have you fallen in the past year?"
    question_code: "Falls"
    google_sheet_tab: "ques_SARC-F"
    google_sheet_row: 22
    response_type: "SING"
    canonical_field_id: ""
  
    - paper_label: "TOTAL SCORE: => 4 is predictive of sarcopenia and poor outcomes."
    question_code: "Score"
    google_sheet_tab: "ques_SARC-F"
    google_sheet_row: 26
    response_type: "TXT"
    canonical_field_id: ""
    
  - paper_label: "Assessed by"
    question_code: "Sarc-F_assessed_by"
    google_sheet_tab: "ques_SARC-F"
    google_sheet_row: 28
    response_type: "TXT"
    canonical_field_id: ""

  
